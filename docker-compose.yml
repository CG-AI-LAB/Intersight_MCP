version: '3.8'

services:
  intersight-mcp-http:
    build: .
    container_name: intersight-mcp-http
    ports:
      - "3000:3000"
    environment:
      # Intersight API Configuration
      - INTERSIGHT_AUTH_METHOD=${INTERSIGHT_AUTH_METHOD:-}
      # OAuth2 client credentials
      - INTERSIGHT_OAUTH2_CLIENT_ID=${INTERSIGHT_OAUTH2_CLIENT_ID:-}
      - INTERSIGHT_OAUTH2_CLIENT_SECRET=${INTERSIGHT_OAUTH2_CLIENT_SECRET:-}
      # API key (HTTP signature)
      - INTERSIGHT_API_KEY_ID=${INTERSIGHT_API_KEY_ID:-}
      - INTERSIGHT_API_SECRET_KEY_PATH=/app/secrets/private_key.pem
      - INTERSIGHT_BASE_URL=${INTERSIGHT_BASE_URL:-https://intersight.com/api/v1}
      # Optional: Custom port
      - PORT=3000
    volumes:
      # Mount your private key file
      - ./auth:/app/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - intersight-network

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: intersight-mcp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - intersight-mcp-http
    networks:
      - intersight-network
    profiles:
      - production

networks:
  intersight-network:
    driver: bridge

# Example usage:
# 1. Create .env file with INTERSIGHT_OAUTH2_CLIENT_ID and INTERSIGHT_OAUTH2_CLIENT_SECRET
#    (or, for API key auth: INTERSIGHT_API_KEY_ID, and copy your private key to ./auth/private_key.pem)
# 2. Run: docker-compose up -d
# 4. For production with SSL: docker-compose --profile production up -d